services:
  postgres:
    image: postgres:16-alpine
    container_name: hvac_postgres
    environment:
      POSTGRES_USER: hvac_admin
      POSTGRES_PASSWORD: HvacSecure2024
      POSTGRES_DB: hvac_booking_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hvac_admin"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hvac_network
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: hvac_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@hvac.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - hvac_network
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: hvac_backend
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://hvac_admin:HvacSecure2024@postgres:5432/hvac_booking_db?schema=public
      - PORT=5000
    ports:
      - "5001:5000"
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
      - ./package.json:/app/package.json
      - ./tsconfig.json:/app/tsconfig.json
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hvac_network
    restart: unless-stopped
    command: npm run dev

networks:
  hvac_network:
    driver: bridge

volumes:
  postgres_data: