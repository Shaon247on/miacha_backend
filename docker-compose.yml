version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: hvac_postgres
    environment:
      POSTGRES_USER: hvac_admin
      POSTGRES_PASSWORD: HvacSecure2024!
      POSTGRES_DB: hvac_booking_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hvac_admin"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hvac_network

  # Optional: pgAdmin for database management (web interface)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: hvac_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@hvac.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - hvac_network

networks:
  hvac_network:
    driver: bridge

volumes:
  postgres_data: